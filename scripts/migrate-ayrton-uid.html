<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migración UID — Ayrton</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 24px; }
  h1 { color: #fff; font-size: 18px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .uid { color: #58a6ff; font-size: 13px; word-break: break-all; }
  #log { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 16px; min-height: 200px; max-height: 500px; overflow-y: auto; font-size: 12px; line-height: 1.7; }
  .ok   { color: #3fb950; }
  .warn { color: #d29922; }
  .err  { color: #f85149; }
  .info { color: #58a6ff; }
  .dim  { color: #666; }
  .btn  { margin-top: 12px; padding: 12px 28px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: monospace; border: 1px solid; }
  .btn-verify  { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-run     { background: #b91c1c; border-color: #ef4444; color: #fff; }
  .btn-cancel  { background: #21262d; border-color: #30363d; color: #aaa; }
  button:disabled { background: #21262d !important; border-color: #30363d !important; color: #555 !important; cursor: not-allowed; }
  #confirm-block { display: none; margin-top: 16px; }
  .confirm-msg { color: #d29922; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
</style>
</head>
<body>

<h1>VDSEN — Recuperación de plan (Ayrton)</h1>
<p class="sub">Herramienta de uso único. Ejecutar autenticado como coach.</p>

<div class="card">
  <div class="label">UID antiguo (doc Firestore original)</div>
  <div class="uid">bXtyOkXlpjfUWBF5dd6xYf6OEny2</div>
  <div class="label" style="margin-top:12px">UID nuevo (Firebase Auth real de Ayrton)</div>
  <div class="uid">z82EDPvsCaabfMN3eGAP3rpxeMt1</div>
</div>

<div class="card">
  <div class="label">Log de ejecución</div>
  <div id="log"><span class="dim">Listo. Presiona "Verificar" para empezar.</span></div>
</div>

<button id="btn-verify" class="btn btn-verify" onclick="runVerify()">Verificar estado actual</button>

<div id="confirm-block">
  <p class="confirm-msg" id="plan-summary"></p>
  <div class="btn-row">
    <button id="btn-run" class="btn btn-run" onclick="runMigration()">Ejecutar</button>
    <button class="btn btn-cancel" onclick="cancelMigration()">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, query, where, getDocs, writeBatch
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBlOmyQEDjjpCxkm7UBqnMJDyqV3NLnCNI",
  authDomain: "vdsen-ecosistema.firebaseapp.com",
  projectId: "vdsen-ecosistema",
  storageBucket: "vdsen-ecosistema.firebasestorage.app",
  messagingSenderId: "1066774387899",
  appId: "1:1066774387899:web:77e7f3570636b71bf61d9e"
};

const OLD_UID = 'bXtyOkXlpjfUWBF5dd6xYf6OEny2';
const NEW_UID = 'z82EDPvsCaabfMN3eGAP3rpxeMt1';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const logEl = document.getElementById('log');
let coachUid = null;
let plan = null; // { mode, planDocs, newClientSnap, oldClientSnap, oldLogSnap, hasOldLog }

function log(msg, cls='') {
  const d = document.createElement('div');
  d.className = cls; d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

onAuthStateChanged(auth, user => {
  if (user) {
    coachUid = user.uid;
    log(`✓ Autenticado: ${user.email} (${user.uid})`, 'ok');
  } else {
    log('✗ Sin sesión activa. Abre la app coach primero, luego esta página.', 'err');
    document.getElementById('btn-verify').disabled = true;
  }
});

window.runVerify = async function() {
  logEl.innerHTML = '';
  document.getElementById('confirm-block').style.display = 'none';
  document.getElementById('btn-verify').disabled = true;
  plan = null;

  try {
    // 1. Verificar coach
    log('▸ Verificando coach...', 'info');
    const coachSnap = await getDoc(doc(db, 'coaches', coachUid));
    if (!coachSnap.exists()) { log('✗ No eres coach en Firestore. Abre con la cuenta del coach.', 'err'); return; }
    log(`  ✓ Coach OK: ${coachSnap.data().displayName || coachSnap.data().email}`, 'ok');

    // 2. Estado del doc viejo
    log('▸ Revisando clients/' + OLD_UID + '...', 'info');
    const oldSnap = await getDoc(doc(db, 'clients', OLD_UID));
    if (oldSnap.exists()) {
      log(`  ✓ Existe. email=${oldSnap.data().email}  activePlanId=${oldSnap.data().activePlanId || 'null'}`, 'ok');
    } else {
      log('  ⚠  Ya no existe (doc viejo eliminado previamente).', 'warn');
    }

    // 3. Estado del doc nuevo
    log('▸ Revisando clients/' + NEW_UID + '...', 'info');
    const newSnap = await getDoc(doc(db, 'clients', NEW_UID));
    if (newSnap.exists()) {
      const nd = newSnap.data();
      log(`  ✓ Existe. email=${nd.email}  activePlanId=${nd.activePlanId || 'null'}`, nd.activePlanId ? 'ok' : 'warn');
      if (nd.activePlanId) {
        log('  ✓ activePlanId ya está asignado. Posiblemente la migración ya ocurrió.', 'ok');
      }
    } else {
      log('  ⚠  No existe aún. Se creará.', 'warn');
    }

    // 4. Buscar planes: clientId=OLD o clientId=NEW
    log('▸ Buscando planes de Ayrton...', 'info');
    const [plansOldQ, plansNewQ] = await Promise.all([
      getDocs(query(collection(db, 'plans'), where('clientId', '==', OLD_UID))),
      getDocs(query(collection(db, 'plans'), where('clientId', '==', NEW_UID))),
    ]);
    const allPlanDocs = [...plansOldQ.docs, ...plansNewQ.docs];
    log(`  → ${allPlanDocs.length} plan(es) encontrado(s) (${plansOldQ.size} con clientId viejo, ${plansNewQ.size} con clientId nuevo)`, allPlanDocs.length > 0 ? 'ok' : 'warn');
    allPlanDocs.forEach(d => log(`    - plans/${d.id}  status=${d.data().status}  clientId=${d.data().clientId.slice(0,8)}...`, 'dim'));

    if (allPlanDocs.length === 0) {
      log('  ✗ No se encontraron planes. No hay nada que asignar.', 'err');
      return;
    }

    // 5. Buscar logs
    log('▸ Revisando logs/' + OLD_UID + '...', 'info');
    const oldLogSnap = await getDoc(doc(db, 'logs', OLD_UID));
    const hasOldLog = oldLogSnap.exists();
    log(`  → ${hasOldLog ? 'Encontrado (' + Object.keys(oldLogSnap.data().entries || {}).length + ' entries)' : 'No existe'}`, hasOldLog ? 'ok' : 'dim');

    // Determinar plan de acción
    const plansNeedClientIdUpdate = plansOldQ.docs; // clientId=OLD_UID, necesitan cambio
    const plansAlreadyNew = plansNewQ.docs;          // clientId=NEW_UID, ya migrados

    // Elegir el plan activo: preferir el que tiene activePlanId del newSnap, o el primero disponible
    const newActivePlanId = newSnap.exists() ? newSnap.data().activePlanId : null;
    let targetPlanId;
    if (newActivePlanId) {
      targetPlanId = newActivePlanId;
    } else if (plansNeedClientIdUpdate.length > 0) {
      targetPlanId = plansNeedClientIdUpdate[0].id;
    } else {
      targetPlanId = plansAlreadyNew[0].id;
    }

    // Modo: cuánto queda por hacer
    const needsNewClientDoc = !newSnap.exists();
    const needsActivePlanId = !newSnap.exists() || !newSnap.data().activePlanId;
    const needsClientIdUpdate = plansNeedClientIdUpdate.length > 0;
    const needsLogMigration = hasOldLog;
    const needsOldDelete = oldSnap.exists();

    if (!needsNewClientDoc && !needsActivePlanId && !needsClientIdUpdate && !needsLogMigration && !needsOldDelete) {
      log('', '');
      log('══ TODO YA ESTÁ HECHO ══════════════════════════', 'ok');
      log(`   clients/${NEW_UID} tiene activePlanId=${newActivePlanId}`, 'ok');
      log('   Dile a Ayrton que refresque la app cliente.', 'ok');
      log('═══════════════════════════════════════════════', 'ok');
      return;
    }

    plan = { newSnap, oldSnap, oldLogSnap, hasOldLog, plansNeedClientIdUpdate, plansAlreadyNew, targetPlanId, needsNewClientDoc, needsActivePlanId, needsClientIdUpdate, needsLogMigration, needsOldDelete };

    const lines = ['Acciones pendientes:'];
    if (needsNewClientDoc) lines.push(`• Crear  clients/${NEW_UID}  ← datos de ${OLD_UID}`);
    if (needsActivePlanId) lines.push(`• Asignar activePlanId=${targetPlanId}  en clients/${NEW_UID}`);
    if (needsClientIdUpdate) lines.push(`• Actualizar clientId → ${NEW_UID}  en ${plansNeedClientIdUpdate.length} plan(es)`);
    if (needsLogMigration) lines.push(`• Migrar logs/${OLD_UID} → logs/${NEW_UID}`);
    if (needsLogMigration) lines.push(`• Borrar logs/${OLD_UID}`);
    if (needsOldDelete) lines.push(`• Borrar clients/${OLD_UID}`);

    document.getElementById('plan-summary').textContent = lines.join('\n');
    document.getElementById('confirm-block').style.display = 'block';
    log('', '');
    log('══ Verificación completa. Revisa el plan y confirma. ══', 'warn');

  } catch(e) {
    log('✗ Error: ' + e.message, 'err');
    console.error(e);
  } finally {
    document.getElementById('btn-verify').disabled = false;
  }
};

window.runMigration = async function() {
  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-verify').disabled = true;
  log('', '');
  log('▸ Ejecutando...', 'info');

  try {
    const { newSnap, oldSnap, oldLogSnap, hasOldLog,
            plansNeedClientIdUpdate, targetPlanId,
            needsNewClientDoc, needsActivePlanId, needsClientIdUpdate, needsLogMigration, needsOldDelete } = plan;

    const batch = writeBatch(db);

    // Crear o actualizar clients/NEW_UID
    if (needsNewClientDoc && oldSnap.exists()) {
      batch.set(doc(db, 'clients', NEW_UID), { ...oldSnap.data(), activePlanId: targetPlanId });
      log(`  ✓ clients/${NEW_UID} preparado (desde doc viejo + activePlanId)`, 'ok');
    } else if (needsActivePlanId) {
      batch.update(doc(db, 'clients', NEW_UID), { activePlanId: targetPlanId });
      log(`  ✓ clients/${NEW_UID} activePlanId=${targetPlanId}`, 'ok');
    }

    // Actualizar clientId en planes con UID viejo
    if (needsClientIdUpdate) {
      plansNeedClientIdUpdate.forEach(d => {
        batch.update(doc(db, 'plans', d.id), { clientId: NEW_UID });
        log(`  ✓ plans/${d.id}  clientId → ${NEW_UID}`, 'ok');
      });
    }

    // Migrar logs
    if (needsLogMigration) {
      batch.set(doc(db, 'logs', NEW_UID), oldLogSnap.data());
      batch.delete(doc(db, 'logs', OLD_UID));
      log(`  ✓ logs migrados ${OLD_UID} → ${NEW_UID}`, 'ok');
    }

    // Borrar doc viejo
    if (needsOldDelete) {
      batch.delete(doc(db, 'clients', OLD_UID));
      log(`  ✓ clients/${OLD_UID} marcado para borrar`, 'ok');
    }

    log('▸ Commit...', 'info');
    await batch.commit();
    log('  ✓ Batch commit OK.', 'ok');

    // Verificar
    log('▸ Verificando...', 'info');
    const vNew = await getDoc(doc(db, 'clients', NEW_UID));
    if (!vNew.exists()) { log('✗ El doc nuevo NO existe. Algo falló.', 'err'); return; }
    const vd = vNew.data();
    log(`  ✓ clients/${NEW_UID}  email=${vd.email}  activePlanId=${vd.activePlanId}`, 'ok');

    const vOld = await getDoc(doc(db, 'clients', OLD_UID));
    log(vOld.exists() ? `  ⚠  clients/${OLD_UID} todavía existe — bórralo desde Firestore Console.` : `  ✓ clients/${OLD_UID} eliminado.`, vOld.exists() ? 'warn' : 'ok');

    log('', '');
    log('══════════════════════════════════════════════', 'ok');
    log(' ✅ Listo. Dile a Ayrton que refresque la app.', 'ok');
    log('══════════════════════════════════════════════', 'ok');
    document.getElementById('confirm-block').style.display = 'none';

  } catch(e) {
    log('✗ Error: ' + e.message, 'err');
    console.error(e);
    document.getElementById('btn-run').disabled = false;
  }
};

window.cancelMigration = function() {
  document.getElementById('confirm-block').style.display = 'none';
  log('Cancelado. No se modificó nada.', 'warn');
};
</script>
</body>
</html>
