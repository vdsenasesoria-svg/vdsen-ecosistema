name: VDSEN client app lane diagnostics (read-only)

# READ-ONLY diagnostics for the app-only release lane.
#
# Reports the HTTP status of each Vercel read the app lane performs, so a failing read
# identifies itself instead of surfacing as a bare "API GET failed: HTTP 400".
#
# This workflow CANNOT mutate anything: it has no promote, no rollback, no Firestore access,
# and it does not consult any release kill switch because it never releases. It exists purely
# to report which endpoint is unhealthy. It never prints a token, a variable value, or a
# response body — only the operation name, HTTP status and a redacted shape summary.

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: 'Exact 40-char candidate SHA to inspect (read-only; never deploys)'
        required: true
        type: string
      note:
        description: 'Optional note for this diagnostic run'
        required: false
        type: string
      ayrton_preflight_check:
        description: 'Also run read-only Ayrton ARM_PREFLIGHT & reconciliation diagnostics'
        required: false
        default: false
        type: boolean
      ayrton_operation_id:
        description: 'Optional operationId to check in DEPLOYMENTS preflight'
        required: false
        default: ''
        type: string
      reconcile_check_run_id:
        description: 'Optional failed run ID to verify read-only reconciliation admissibility'
        required: false
        default: ''
        type: string
      ayrton_pilot_uid:
        description: 'Optional Ayrton UID for read-only ARM_PREFLIGHT check'
        required: false
        default: ''
        type: string
      ayrton_coach_id:
        description: 'Optional Coach ID for read-only ARM_PREFLIGHT check'
        required: false
        default: ''
        type: string
      ayrton_plan_id:
        description: 'Optional active plan ID for read-only ARM_PREFLIGHT check'
        required: false
        default: ''
        type: string
      ayrton_pid:
        description: 'Optional single authorized PID for read-only ARM_PREFLIGHT check'
        required: false
        default: 'ab150537-0d02-423b-a7e0-2b2f1a8a9a83'
        type: string
      ayrton_expires_at:
        description: 'Optional fixed UTC expiry for read-only ARM_PREFLIGHT check (never writes Firestore)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate runtime_sha (exact 40-char commit SHA that exists in this repository)
        # Fails BEFORE any credential is used. Rejects HEAD, latest, branch names, short or
        # uppercase SHAs, and a well-formed SHA that is not a commit of this repository.
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          if [[ ! "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::runtime_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          git cat-file -e "${RUNTIME_SHA}^{commit}" || { echo "::error::runtime_sha is not a commit of this repository"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe endpoint health (independent of the lane code)
        run: node scripts/release/app-diagnostics.cjs
      - name: Run the lane's REAL read path with a redacted read trace
        # The critical step. A separate probe reported every read healthy while the release
        # preflight failed on the same endpoint, because the probe was a DIFFERENT code path.
        # This runs readOnlyPreflight() - the exact reads the release performs - with
        # APP_TRACE_READS so each request is logged by parameter NAME and value LENGTH only.
        # No token, no parameter value and no response body is printed.
        env:
          APP_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          APP_EXPECTED_MAIN_SHA: 5f25b5b9a3c45b425bad4d8eadd145cf7423aec7
          APP_TRACE_READS: 'true'
        run: |
          set -o pipefail
          node scripts/release/app-live.cjs read-only-preflight 2>&1 | tee /tmp/rop.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error::read-only preflight exited $status"
            cat /tmp/rop.log
          fi
          exit "$status"
      - name: Can the resolved candidate actually be promoted?
        # The promote endpoint answers 422 even though the request matches its published schema
        # (no request body, teamId in query). 422 is a documented response for that operation, so
        # the deployment itself is likely not eligible. This reports the candidate's own flags
        # (target, readyState, state, ready, isRollbackCandidate) as booleans/names only.
        if: always()
        env:
          APP_RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: node scripts/release/app-candidate-check.cjs
      - id: google
        if: inputs.ayrton_preflight_check == true && github.repository == 'vdsenasesoria-svg/vdsen-ecosistema' && github.ref == 'refs/heads/codex/client-app-next'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        continue-on-error: true
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/datastore
      - name: Run Ayrton ARM_PREFLIGHT & reconciliation diagnostics (read-only)
        if: inputs.ayrton_preflight_check == true
        env:
          AYRTON_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          AYRTON_OPERATION_ID: ${{ inputs.ayrton_operation_id }}
          RECONCILE_CHECK_RUN_ID: ${{ inputs.reconcile_check_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pilot/ayrton-preflight-diagnostics.cjs
      - name: Run Ayrton real ARM_PREFLIGHT read-only check with WIF Firestore read
        if: inputs.ayrton_preflight_check == true && inputs.ayrton_pilot_uid != '' && inputs.ayrton_coach_id != '' && inputs.ayrton_plan_id != '' && inputs.ayrton_expires_at != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          WIF_AUTH_OUTCOME: ${{ steps.google.outcome }}
          PILOT_WINDOW_FILE: release-output/ayrton-window-input.json
          AYRTON_PREFLIGHT_OUT: release-output/ayrton-runtime-preflight.json
          INPUT_RUNTIME: ${{ inputs.runtime_sha }}
          INPUT_UID: ${{ inputs.ayrton_pilot_uid }}
          INPUT_COACH: ${{ inputs.ayrton_coach_id }}
          INPUT_PLAN: ${{ inputs.ayrton_plan_id }}
          INPUT_PID: ${{ inputs.ayrton_pid }}
          INPUT_EXPIRY: ${{ inputs.ayrton_expires_at }}
          INPUT_OPERATION: ${{ inputs.ayrton_operation_id }}
        run: |
          echo "WIF_AUTH_OUTCOME=$WIF_AUTH_OUTCOME"
          node scripts/pilot/off-baseline.cjs
          node -e "const fs=require('fs'),s=require('./.release/vdsen-client.json');fs.mkdirSync('release-output',{recursive:true});const w={schema:'vdsen-ayrton-window-v1',mode:'STAGE1_SHADOW',pid:process.env.INPUT_PID||'ab150537-0d02-423b-a7e0-2b2f1a8a9a83',uid:process.env.INPUT_UID,coachId:process.env.INPUT_COACH,planId:process.env.INPUT_PLAN,runtimeSha:process.env.INPUT_RUNTIME||s.runtime_sha,deployment:s.production_deployment,expiresAt:process.env.INPUT_EXPIRY,operationId:process.env.INPUT_OPERATION||'op-diag-readonly-check'};require('./scripts/pilot/window-protocol.cjs').windowSpec(w);fs.writeFileSync(process.env.PILOT_WINDOW_FILE,JSON.stringify(w));"
          node scripts/pilot/ayrton-runtime.cjs diagnose-preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-diagnostics-${{ github.run_id }}
          path: |
            release-output/app-diagnostics.json
            release-output/ayrton-preflight-diagnostics.json
            release-output/ayrton-runtime-preflight.json
          if-no-files-found: warn
          retention-days: 30
