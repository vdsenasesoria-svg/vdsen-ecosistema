name: VDSEN Image Upload acceptance

# Local/emulator acceptance for the Coach exercise-image upload. NOTHING here touches production: the
# project id is a demo-* one, so reaching a real Firebase/Storage resource is impossible by construction.
#
# TEST TOOLING IS NOT A PRODUCT DEPENDENCY
# The Storage rules can only be exercised through the normal Firebase CLIENT SDK (there is no Storage
# client in @firebase/rules-unit-testing), and the rules under test must be evaluated by the same client
# generation the browser uses. Adding it to package.json would be the obvious move, but check.cjs
# requires package.json to be byte-identical to the approved runtime SHA, so a new dependency would
# invalidate the release provenance of a different workstream. Instead the SDK is installed into a
# throwaway runtime and exposed through NODE_PATH for this job only - the same pattern already used for
# the emulator binaries. The product's package.json is untouched.
#
# Emulator binaries are downloaded by the CLI on demand; a cache is welcome but correctness never
# depends on it.

on:
  pull_request:
    branches: [codex/client-app-next]
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'firebase.image-upload-emulator.json'
      - 'scripts/image-upload-e2e/**'
      - 'tests/image-upload*'
      - 'tests/coach-image-upload*'
      - 'tests/coach-visual-metadata*'
      - 'assets/coach-image-upload/**'
      - 'assets/exercise-visual-metadata-editor.js'
      - 'vdsen-coach.html'
      - '.github/workflows/vdsen-image-upload-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-upload-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-vdsen-image-upload
      # Pinned to the same SDK generation the product loads from the CDN.
      FIREBASE_SDK_VERSION: '10.12.0'
      FIREBASE_TOOLS_VERSION: '15.32.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A demo- project cannot reach production. Assert it before anything else runs.
      - name: Assert demo project (never production)
        run: |
          case "$GCLOUD_PROJECT" in
            demo-*) echo "demo project OK: $GCLOUD_PROJECT" ;;
            *) echo "ABORT: project id must start with demo-"; exit 1 ;;
          esac
          if echo "$GCLOUD_PROJECT" | grep -qE 'vdsen-ecosistema($|-staging)'; then
            echo "ABORT: production/staging project id"; exit 1
          fi

      - name: Install Firebase client SDK into a throwaway test runtime
        run: |
          RUNTIME="$RUNNER_TEMP/iu-runtime"
          mkdir -p "$RUNTIME"
          cd "$RUNTIME"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "firebase@${FIREBASE_SDK_VERSION}"
          echo "NODE_PATH=$RUNTIME/node_modules" >> "$GITHUB_ENV"
          node -e "console.log('firebase/app -> ' + require.resolve('firebase/app'))"

      - name: Storage rules compile (official runtime)
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --config firebase.image-upload-emulator.json \
            --project "$GCLOUD_PROJECT" \
            --only storage \
            "node -e \"console.log('STORAGE_RULES_COMPILE=PASS')\""

      - name: Storage rules security matrix
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec \
            --config firebase.image-upload-emulator.json \
            --project "$GCLOUD_PROJECT" \
            "node tests/image-upload-storage-rules.cjs"

      - name: Module unit tests
        run: |
          node --test tests/coach-image-upload.test.js
          node --test tests/coach-image-upload-two-phase.test.js
          node --test tests/coach-image-upload-integration-boundaries.test.js
          node --test tests/coach-image-upload-save-race.test.js
          node --test tests/coach-image-upload-identity.test.js
          node --test tests/coach-image-upload-prepared-identity.test.js
          node --test tests/coach-image-upload-lifecycle.test.js
          node --test tests/coach-visual-metadata.test.js

      - name: Full browser and real-emulator acceptance
        run: node scripts/image-upload-e2e/run-image-upload-acceptance.cjs

      - name: Release check
        run: node scripts/release/check.cjs

      - name: Unit baseline
        id: unit
        continue-on-error: true
        run: node scripts/release/baseline.cjs unit

      - name: Report unit baseline
        run: |
          node -e "
            const fs=require('fs');
            const f=fs.readdirSync('release-output').map(x=>'release-output/'+x).filter(x=>x.includes('unit'))[0];
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            console.log('UNIT_RAW='+j.raw_results.PASS+'/'+j.raw_results.FAIL);
            console.log('NEW_REGRESSIONS='+j.NEW_REGRESSIONS);
            console.log('CRITICAL='+JSON.stringify(j.critical_failure_ids||[]));
            console.log('UNIT_GATE='+j.gate);
            if(j.gate!=='PASS'){ process.exit(1); }
          "

      - name: Whitespace / conflict markers
        run: git diff --check

      - name: Acceptance contract
        run: |
          set -e
          echo "STORAGE_RULES=PASS"
          echo "IMMUTABILITY=PASS"
          echo "MAGIC_BYTES=PASS"
          echo "PROCESSOR_REQUIRED=PASS"
          echo "SINGLE_FLIGHT=PASS"
          echo "PRODUCTION_CONTACT=0"
          echo "RELEASE_CHECK=PASS"
          echo "IMAGE_UPLOAD_ACCEPTANCE=PASS"
