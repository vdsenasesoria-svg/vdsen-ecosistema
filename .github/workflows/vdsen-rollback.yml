name: VDSEN rollback
on:
  workflow_dispatch:
    inputs:
      rollback_deployment:
        description: Previous production deployment ID from captured artifact
        required: true
        type: string
      release_run_id:
        description: Production release workflow run ID containing rollback-rules artifact
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vdsen-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/codex/client-app-next'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_RELEASE_TOKEN }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      ROLLBACK_DEPLOYMENT: ${{ inputs.rollback_deployment }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate inputs and emergency stop
        run: |
          test "$PRODUCTION_RELEASE_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/codex/client-app-next
          node -e "require('node:assert/strict').match(process.env.RELEASE_RUN_ID, /^[0-9]+$/)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rollback-rules-${{ inputs.release_run_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: release-output
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase
      - name: Verify artifact provenance; restore rules BEFORE app; verify runtime and smoke
        run: node scripts/release/live.cjs rollback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Ensure failure result exists
        if: always()
        run: node scripts/release/live.cjs rollback-result
      - name: Rollback result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-result-${{ github.run_id }}
          path: release-output/result.json
          if-no-files-found: warn
          retention-days: 90
