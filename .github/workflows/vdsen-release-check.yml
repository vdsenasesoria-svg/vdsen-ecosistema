name: VDSEN release check
on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact reviewed runtime SHA
        required: true
        type: string
  pull_request:
    branches: [codex/client-app-next]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_SHA: ${{ inputs.runtime_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate reviewed state and runtime equivalence
        run: node scripts/release/check.cjs
      - name: Full repository unit suite
        run: node --test tests/*.test.js
      - name: All canonical emulator suites
        run: node scripts/test-auto-apply-emulator.cjs
      - run: git diff --check
