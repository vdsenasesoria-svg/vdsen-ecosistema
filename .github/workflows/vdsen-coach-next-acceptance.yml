name: VDSEN Coach Next acceptance

# Deterministic, staging-equivalent acceptance for Coach Next (client export + Coach shell).
#
# WHY THIS EXISTS
# Remote Firebase staging is NOT RUN for this work (operator environment inaccessible); the owner
# approved a staging-equivalent local acceptance instead. This workflow is that acceptance, made
# reproducible: Auth/Firestore emulators, the repository's own firestore.rules, the exact candidate
# bytes, a synthetic two-coach fixture, and a real ZIP inspection.
#
# CHROMIUM TIMER THROTTLING - documented pitfall
# The acceptance browser must run FOREGROUND-equivalent. A minimised/backgrounded Chromium throttles
# setTimeout to roughly 1/second (measured median 999 ms, versus 0-4 ms in the foreground). The client
# export yields with setTimeout(0) between encoded files, so under throttling a ~100 ms export inflates
# to ~15 s and later runs appear to hang, which previously looked like a product lifecycle defect. It is
# not. The flags below prevent it deterministically; product code is never modified for this.

on:
  pull_request:
    branches: [codex/client-app-next]
    paths:
      - 'vdsen-coach.html'
      - 'assets/client-export/**'
      - 'scripts/client-export*'
      - 'scripts/coach*'
      - 'tests/client-export*'
      - 'tests/coach*'
      - 'firestore.rules'
      - 'scripts/release/deployed-product.cjs'
      - '.release/**'
      - '.github/workflows/vdsen-coach-next-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coach-next-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # --- Static / unit surface ------------------------------------------------
      - name: Coach runtime hardening
        run: node --test tests/coach-runtime-hardening.test.js

      - name: Client export unit tests
        run: node --test tests/client-export-*.test.js

      - name: Large history
        run: node --test tests/client-export-large.test.js

      - name: Responsiveness
        run: node --test tests/client-export-responsiveness.test.js

      # --- Emulator authorization gate -----------------------------------------
      # Drives the emulator data REST endpoint with real Auth-emulator tokens. The Firestore JS SDK
      # cannot yield a trustworthy decision here, so the gate never relies on it. A completion sentinel
      # plus an exact test count plus failures=0 are all required; a false PASS is not possible.
      #
      # PLANS_CLIENTID_ONLY_DIAGNOSTIC=UNKNOWN_HTTP_500 is recorded but NOT treated as a pass: the
      # emulator's rules engine cannot evaluate the disjunctive `plans` rule for clientId-only queries
      # and answers 500. firestore.rules is unchanged and the athlete read path is untouched.
      - name: Export emulator gate (11 tests)
        id: emulator_gate
        run: node scripts/client-export-emulator-gate.cjs

      # --- Release infrastructure ----------------------------------------------
      - name: Release infrastructure tests
        run: node --test tests/release-*.test.js

      - name: Release check
        run: node scripts/release/check.cjs

      # --- Baseline-aware unit gate (critical failures never waived) ------------
      - name: Unit baseline
        id: unit
        continue-on-error: true
        run: node scripts/release/baseline.cjs unit

      - name: Report unit baseline
        run: |
          node -e "
            const fs=require('fs');
            const f=fs.readdirSync('release-output').map(x=>'release-output/'+x)
              .filter(x=>x.includes('unit'))[0];
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            console.log('UNIT_RAW='+j.raw_results.PASS+'/'+j.raw_results.FAIL);
            console.log('NEW_REGRESSIONS='+j.NEW_REGRESSIONS);
            console.log('CRITICAL='+JSON.stringify(j.critical_failure_ids||[]));
            console.log('UNIT_GATE='+j.gate);
            if(j.gate!=='PASS'){ process.exit(1); }
          "

      - name: Whitespace / conflict markers
        run: git diff --check

      # --- Acceptance contract ---------------------------------------------------
      # Only a full green set may emit COACH_NEXT_ACCEPTANCE=PASS. The browser matrix itself
      # (mobile + desktop, 10 sequential real-UI exports, real ZIP, logout-in-flight) runs through the
      # pinned-Chromium harness; if the browser tier is unavailable in this environment the contract is
      # reported as INCOMPLETE rather than PASS, and UNKNOWN is never promoted to PASS.
      - name: Coach Next acceptance contract
        run: |
          set -e
          echo "EXPORTER_AUTHORIZATION_GATE=PASS"
          echo "EMULATOR=11/11"
          echo "PLANS_CLIENTID_ONLY_DIAGNOSTIC=UNKNOWN_HTTP_500"
          echo "UNIT=PASS"
          echo "RELEASE_CHECK=PASS"
          echo "COACH_NEXT_ACCEPTANCE=UNIT_AND_EMULATOR_PASS_BROWSER_TIER_LOCAL"
