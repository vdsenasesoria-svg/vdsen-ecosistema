name: VDSEN Storage Rules live readback (read-only)

# READ-ONLY (GET-only). Reads the ACTIVE Firebase Storage rules release/ruleset, compares its hash with
# storage.rules and captures a rollback artifact. It authenticates as a DEDICATED read-only service
# account (vars.GCP_STORAGE_READONLY_SERVICE_ACCOUNT) with the read-only firebase scope. There is no
# fallback to the release service account: storage-rules.cjs refuses to run if that variable is unset,
# equals the release bot, or does not match the reserved read-only identity.
# It cannot publish rules: the CLI exposes only readback|capture|plan|verify-artifact, its transport
# rejects every non-GET method, and apply/rollback are library-only (see docs/STORAGE_RULES_RELEASE_RUNBOOK.md).
# Retention of the uploaded artifact is TEMPORARY (30 days); it is not an immutable store.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  readback:
    if: github.repository == 'vdsenasesoria-svg/vdsen-ecosistema' && github.ref == 'refs/heads/codex/client-app-next'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_STORAGE_READONLY_SERVICE_ACCOUNT: ${{ vars.GCP_STORAGE_READONLY_SERVICE_ACCOUNT }}
      GCP_RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require the dedicated read-only identity (no fallback)
        run: node -e "require('./scripts/release/storage-rules.cjs').assertReadonlyIdentity(process.env)"
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STORAGE_READONLY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
      - name: Read live Storage rules and capture rollback artifact
        run: node scripts/release/storage-rules.cjs capture
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Record the custody digest in the run summary
        if: always()
        run: |
          if [ -f release-output/storage-custody.json ]; then
            { echo '### Storage rollback artifact custody'; echo; echo '```json'; cat release-output/storage-custody.json; echo '```'; \
              echo 'Retention is temporary and immutability is NOT demonstrated: record the digest out-of-band (approval ticket).'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Storage readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-readback-${{ github.run_id }}
          path: release-output/
          if-no-files-found: warn
          retention-days: 30
