name: VDSEN Storage Rules live readback (read-only)

# READ-ONLY. Reads the ACTIVE Firebase Storage rules release/ruleset through the existing OIDC
# release identity, compares their hash with storage.rules, and captures the rollback artifact.
# It cannot publish rules: storage-rules.cjs exposes only readback|capture|plan on the CLI, and
# apply/rollback are library-only. No kill switch is consulted because nothing is released.
# Requires the release service account to hold firebaserules.releases.get and
# firebaserules.rulesets.get (see docs/STORAGE_RULES_RELEASE_RUNBOOK.md). Never prints tokens or bodies.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  readback:
    if: github.repository == 'vdsenasesoria-svg/vdsen-ecosistema' && github.ref == 'refs/heads/codex/client-app-next'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase
      - name: Read live Storage rules and capture rollback artifact
        run: node scripts/release/storage-rules.cjs capture
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Storage readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-readback-${{ github.run_id }}
          path: release-output/
          if-no-files-found: warn
          retention-days: 30
