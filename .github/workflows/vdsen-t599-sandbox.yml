name: VDSEN T599 sandbox
on:
  pull_request:
    branches: [codex/client-app-next]
    paths:
      - 'vdsen-cliente.html'
      - 'assets/progression-*.js'
      - 'api/*Progression*.js'
      - 'api/autonomous-progression-trigger.js'
      - 'scripts/e2e-client-chain/**'
      - 'scripts/e2e-t599r/**'
      - 'assets/**'
      - 'scripts/client-auth-e2e.cjs'
      - '.github/workflows/vdsen-t599-sandbox.yml'
permissions:
  contents: read
jobs:
  browser:
    name: Real Client progression and sync (demo only)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install product and isolated QA dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $qa = Join-Path $env:RUNNER_TEMP 't599-qa'
          npm install --prefix $qa --no-save --no-package-lock --ignore-scripts --no-audit --no-fund firebase-tools@13.35.1 playwright-core@1.56.1 firebase@10.12.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NODE_PATH=$(Join-Path $qa 'node_modules')" >> $env:GITHUB_ENV
          "T599_QA=$qa" >> $env:GITHUB_ENV
      - name: Authenticated Client acceptance
        run: node scripts/client-auth-e2e.cjs --out release-output/t599/auth.json
      - name: Real Client applied lifecycle, continuity, two browsers, offline and mobile runtime
        shell: pwsh
        run: |
          # T603: the sandbox emulator runs the CANDIDATE rules (deployed rules + start markers / decision records); firestore.rules itself is untouched
          Copy-Item -LiteralPath firestore.t603.rules -Destination (Join-Path $env:T599_QA 'firestore.rules')
          $cfg = Join-Path $env:T599_QA 'firebase.json'
          @{firestore=@{rules='firestore.rules'};emulators=@{auth=@{host='127.0.0.1';port=9099};firestore=@{host='127.0.0.1';port=8085};ui=@{enabled=$false};singleProjectMode=$true}} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $cfg
          node (Join-Path $env:T599_QA 'node_modules/firebase-tools/lib/bin/firebase.js') emulators:exec --only auth,firestore --project demo-vdsen-client-e2e --config $cfg 'node scripts/e2e-client-chain/t599-browser-gates.cjs'
          exit $LASTEXITCODE
      - name: Sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t599-sandbox-${{ github.run_id }}
          path: release-output/t599/
          if-no-files-found: warn
