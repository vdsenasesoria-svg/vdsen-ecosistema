name: VDSEN production release
on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact reviewed runtime SHA
        required: true
        type: string
      reason:
        description: Release reason
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: vdsen-production
  cancel-in-progress: false
jobs:
  gates:
    if: github.ref == 'refs/heads/codex/client-app-next'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_SHA: ${{ inputs.runtime_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate reviewed state and runtime equivalence
        run: node scripts/release/check.cjs
      - name: Baseline-aware unit gate (critical failures never waived)
        id: unit
        continue-on-error: true
        run: node scripts/release/baseline.cjs unit
      - name: Baseline-aware canonical emulator gate
        id: emulator
        continue-on-error: true
        run: node scripts/release/baseline.cjs emulator
      - name: Baseline reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-baseline-${{ github.run_id }}
          path: release-output/*-baseline-result.json
          if-no-files-found: warn
      - name: Enforce both baseline gates
        if: steps.unit.outcome != 'success' || steps.emulator.outcome != 'success'
        run: exit 1
      - run: git diff --check
      - name: Record failed gates
        if: failure()
        run: node scripts/release/live.cjs release-result
      - name: Failed gate result
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-result-${{ github.run_id }}
          path: release-output/result.json
          if-no-files-found: warn
          retention-days: 90

  release:
    needs: gates
    if: github.ref == 'refs/heads/codex/client-app-next'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RUNTIME_SHA: ${{ inputs.runtime_sha }}
      RELEASE_REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Emergency stop and trusted ref
        run: |
          test "$PRODUCTION_RELEASE_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/codex/client-app-next
      - name: Retrieve exact test gates from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-baseline-${{ github.run_id }}
          path: release-output
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase
      - name: Verify live preconditions and capture rollback source
        run: node scripts/release/live.cjs prepare
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Persist rollback source BEFORE mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-rules-${{ github.run_id }}
          path: release-output/rollback.json
          if-no-files-found: error
          retention-days: 90
      - name: Deploy exact rules only; restore verified rules then app on failure
        run: node scripts/release/live.cjs apply
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
      - name: Ensure failure result exists
        if: always()
        run: node scripts/release/live.cjs release-result
      - name: Release result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-result-${{ github.run_id }}
          path: release-output/result.json
          if-no-files-found: warn
          retention-days: 90
