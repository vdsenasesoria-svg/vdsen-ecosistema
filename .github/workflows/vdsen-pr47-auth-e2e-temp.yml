name: VDSEN PR47 authenticated E2E temporary

on:
  push:
    branches: [qa/pr47-auth-e2e-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-authenticated-demo:
    name: Coach authenticated demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 336324557103988830efc38b4773eebf743f92d7
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install temporary browser runtime
        run: |
          npm install --global --no-audit --no-fund playwright@1.51.1
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"

      - name: Run Coach authenticated E2E against demo emulators
        run: node scripts/coach-runtime-e2e.cjs --out pr47-coach-auth-e2e.json

  client-authenticated-coverage:
    name: Client authenticated demo coverage inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 336324557103988830efc38b4773eebf743f92d7
          persist-credentials: false

      - name: Record absent local Client authenticated harness
        run: |
          echo "CLIENT_AUTH_QA=NOT_RUN"
          echo "REASON=no local demo Auth/Firestore emulator harness for nutrition snapshot visibility"
          echo "EXCLUDED=scripts/client-staging-browser.cjs uses Firebase staging and is outside this workflow's scope"
