name: VDSEN consolidated authenticated E2E

on:
  push:
    branches: [qa/release-auth-e2e-20261014]
  workflow_dispatch:
    inputs:
      run_coach_again:
        description: Run Coach authenticated E2E as well as Client
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  coach-authenticated-demo:
    name: Coach authenticated demo E2E
    if: github.event_name == 'push' || inputs.run_coach_again
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 31db835982417e876e2344eff57aadad5f801bad
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install temporary browser runtime
        run: |
          npm install --global --no-audit --no-fund playwright@1.51.1
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"

      - name: Verify exact Coach product candidate
        run: |
          test "$(git rev-parse HEAD)" = "31db835982417e876e2344eff57aadad5f801bad"
          test "$(git ls-remote origin refs/heads/codex/client-app-next | cut -f1)" = "31db835982417e876e2344eff57aadad5f801bad"

      - name: Run Coach authenticated E2E against demo emulators
        run: node scripts/coach-runtime-e2e.cjs --out consolidated-coach-auth-e2e.json

  client-authenticated-e2e:
    name: Client authenticated demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact consolidated product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 31db835982417e876e2344eff57aadad5f801bad
          path: product-under-test
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify exact Client product candidate
        run: |
          test "$(git -C product-under-test rev-parse HEAD)" = "31db835982417e876e2344eff57aadad5f801bad"
          test "$(git ls-remote origin refs/heads/codex/client-app-next | cut -f1)" = "31db835982417e876e2344eff57aadad5f801bad"
          git -C product-under-test diff --check 31db835982417e876e2344eff57aadad5f801bad

      - name: Install isolated E2E dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund firebase-admin@13.10.0 firebase-tools@13.35.1 firebase@10.12.0 esbuild@0.25.10 playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run Client authenticated E2E against demo emulators
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product-under-test
        run: node scripts/client-auth-e2e.cjs --out consolidated-client-auth-e2e.json
